<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17325C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alinha Face">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<title>Minha agenda · Alinha Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  .shell{max-width:980px;margin:0 auto;padding:18px 16px 60px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .top .brand{margin-right:auto}
  .who{font-size:13.5px;color:var(--ink-2)}
  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-bottom:18px;width:max-content;max-width:100%;overflow-x:auto}
  .tabs button{border:0;background:transparent;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
  .tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .kpi{padding:12px 14px}
  .kpi .v{font-family:var(--font-display);font-size:26px;font-weight:700;display:block;line-height:1.1}
  .kpi .l{font-size:12.5px;color:var(--ink-3)}
  .kpi.alert .v{color:var(--crit)}
  section.grupo{margin-bottom:22px}
  section.grupo h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  section.grupo h2 .n{font-family:var(--font-body);font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:1px 8px}
  .lista{display:flex;flex-direction:column;gap:8px}
  .item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line)}
  .item:hover{border-color:var(--line-strong)}
  .item .quando{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.15}
  .item .quando small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-3)}
  .item .nome{font-weight:600}
  .item .det{font-size:13px;color:var(--ink-3)}
  .pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}
  .pill.neu{background:var(--surface-3);color:var(--ink-2)}
  .vazio{padding:18px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-strong);border-radius:var(--radius)}
  .busca{margin-bottom:12px}

  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .drawer header h2{font-size:19px;margin-right:auto}
  .drawer .body{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
  .drawer footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .ficha{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:14px}
  .ficha div span{display:block;font-size:12px;color:var(--ink-3)}
  .ficha .full{grid-column:1/-1}
  .bloco h3{font-size:15px;margin-bottom:10px}
  .opcoes{display:flex;gap:8px;flex-wrap:wrap}
  .opcoes label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;cursor:pointer;min-height:42px}
  .opcoes input{accent-color:var(--accent)}
  .opcoes label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .perg{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .perg > span{font-size:13px;font-weight:500;color:var(--ink-2)}
  .registrado{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
  .hist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
  .hist div{display:grid;grid-template-columns:52px 1fr;gap:8px}
  .hist .d{color:var(--ink-3);font-variant-numeric:tabular-nums}
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr 1fr 1fr;gap:6px}
    .kpi{padding:10px}
    .kpi .v{font-size:21px}
    .item{grid-template-columns:58px 1fr;}
    .item .pill{grid-column:2;justify-self:start}
    .ficha{grid-template-columns:1fr}
  }
  
  /* avisos da equipe */
  #tAvisos.novo{color:#6B4FA0;font-weight:700}
  .av{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:var(--surface);margin-bottom:10px}
  .av.pend{border-color:#6B4FA0;box-shadow:inset 3px 0 0 #6B4FA0}
  .av.feito{opacity:.65}
  .av-topo{display:flex;justify-content:space-between;gap:8px;font-size:13px}
  .av-topo span{color:var(--ink-3);white-space:nowrap}
  .av-pac{align-self:flex-start;border:0;background:var(--surface-2);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .av-txt{white-space:pre-wrap;line-height:1.45}
  .av-anexo{align-self:flex-start;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:600}
  .av-rod{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .av-st{font-size:12px;color:var(--ink-3)}
  .av-ops{display:flex;gap:6px;flex-wrap:wrap}
  .av-resp{display:flex;flex-direction:column;gap:8px}
  .av-resp textarea{min-height:80px}
  .av-cita{font-size:12.5px;color:var(--ink-3);border-left:2px solid var(--line-strong);padding-left:8px}

  /* agenda em calendário */
  .cal-top{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
  .cal-top h2{font-size:19px;margin:0 6px;min-width:190px;text-align:center}
  .cal-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal .dow{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center;padding:2px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .cal .dia{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal .dia:hover{border-color:var(--line-strong)}
  .cal .dia.fora{opacity:.45}
  .cal .dia.hoje .num{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
  .cal .dia.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .cal .num{font-size:12.5px;font-weight:600;align-self:flex-start;margin-bottom:2px}
  .cal .ev{font-size:11.5px;line-height:1.3;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);color:var(--ink)}
  .cal .ev b{font-weight:600}
  .cal .ev.ok{background:var(--ok-bg);color:var(--ok)}
  .cal .ev.warn{background:var(--warn-bg);color:var(--warn)}
  .cal .ev.crit{background:var(--crit-bg);color:var(--crit)}
  .cal .mais{font-size:11px;color:var(--ink-3);padding-left:4px}
  .cal .pontos{display:none;font-size:9px;letter-spacing:1px;color:var(--accent)}
  .cal-det h2{font-size:16px}
  @media (max-width:900px){ .cal-wrap{grid-template-columns:1fr} }
  @media (max-width:600px){
    .cal .dia{min-height:54px;padding:4px;align-items:center}
    .cal .ev,.cal .mais{display:none}
    .cal .pontos{display:block}
    .cal-top h2{min-width:0;font-size:17px}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="16" fill="var(--accent-soft)"></circle>
        <path d="M17 1a16 16 0 0 0 0 32Z" fill="var(--accent)"></path>
        <path d="M5 26 L27 7" stroke="var(--gold)" stroke-width="1.6" fill="none"></path>
      </svg>
      <div><h1>Alinha Face</h1><div class="sub" id="ola">Carregando…</div></div>
    </div>
    <button class="btn btn-sm btn-ghost" id="bSenha">Trocar senha</button>
    <button class="btn btn-sm" id="bSair">Sair</button>
  </div>

  <div class="tabs" role="group" aria-label="Visualização">
    <button id="tAgenda" aria-pressed="true">Agenda</button>
    <button id="tPac" aria-pressed="false">Meus pacientes</button>
    <button id="tAvisos" aria-pressed="false">Avisos da equipe</button>
  </div>

  <div id="conteudo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="tele.js"></script>
<script>
const $ = s => document.querySelector(s);
function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; }
function toast(m){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t = el("div","toast",m); document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
const hoje = () => new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo"}).format(new Date());
const dataBR = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "";
const DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
const diaSemana = d => DIAS[new Date(d+"T12:00:00").getDay()];
const somaDias = (d,n) => { const x = new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };

const ETAPAS = {triagem:"A classificar",lead:"Lead novo",agendou:"Consulta agendada",compareceu:"Atendido",exames_sol:"Exames pedidos",
  exames_ok:"Exames entregues",retorno:"Retorno feito",proposta:"Proposta enviada",docs_conv:"Documentos do convênio",
  autorizacao:"Aguardando autorização",autorizado:"Autorizado",cir_marcada:"Cirurgia marcada",cir_feita:"Cirurgia realizada",
  posop:"Pós-operatório",noshow:"Faltou",perdido:"Encerrado"};

const sb = FUNIL.sb;
const TIPOS_EXAME = ["Ressonância magnética","Tomografia","Radiografia / panorâmica","Exames de sangue","Outro"];
let eu = null, pacientes = [], aba = "agenda", busca = "", avisos = [];

function precisaRegistro(p){
  return p.dataConsulta && p.dataConsulta <= hoje() && !p.consultaRegistradaEm && ["agendou","lead","triagem"].includes(p.etapa);
}
function situacao(p){
  if(p.consultaRegistradaEm){
    if(p.consultaCompareceu === false) return ["Não compareceu","crit"];
    if(p.consultaPediuExames) return ["Atendido · exames","ok"];
    return ["Atendido","ok"];
  }
  if(precisaRegistro(p)) return ["Falta registrar","warn"];
  return [ETAPAS[p.etapa]||"—","neu"];
}

async function carregar(){
  const { data, error } = await sb.from("funil_pacientes").select("id,dados").order("atualizado_em",{ascending:false});
  if(error){ toast("Não consegui carregar seus pacientes. Recarregue a página."); return; }
  pacientes = data.map(r => Object.assign({id:r.id}, r.dados));
  render();
}

function render(){
  $("#tAgenda").setAttribute("aria-pressed", aba==="agenda");
  $("#tPac").setAttribute("aria-pressed", aba==="pac");
  $("#tAvisos").setAttribute("aria-pressed", aba==="avisos");

  badgeAvisos();
  if(aba === "avisos") return renderAvisos();
  aba === "agenda" ? renderAgenda() : renderPacientes();
}

/* ---------- avisos da equipe (recados para o cirurgião) ---------- */
const quando = iso => { if(!iso) return ""; const d = new Date(iso);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"}); };
const meuEmail = () => String((eu&&eu.email)||"").toLowerCase();
const avisosPendentes = () => avisos.filter(r => r.para === meuEmail() && !r.feito_em);
async function carregarAvisos(){
  const { data, error } = await sb.from("funil_recados").select("*").order("criado_em",{ascending:false}).limit(300);
  if(error) return;
  avisos = data || [];
  badgeAvisos();
  if(aba === "avisos") renderAvisos();
  const sec = document.getElementById("avFicha"); if(sec) desenharAvisosFicha(sec, sec.dataset.pid);
}
function badgeAvisos(){
  const b = $("#tAvisos"); if(!b) return;
  const n = avisosPendentes().length, novos = avisos.filter(r=>r.para===meuEmail() && !r.lido_em).length;
  b.textContent = n ? "Avisos da equipe · " + n : "Avisos da equipe";
  b.classList.toggle("novo", novos > 0);
}
async function abrirAnexo(r){
  const w = window.open("about:blank","_blank");
  const { data, error } = await sb.storage.from("anexos").createSignedUrl(r.anexo, 600);
  if(error || !data){ if(w) w.close(); toast("Não consegui abrir o anexo."); return; }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
function cartaoAviso(r, naFicha){
  const c = el("div","av" + (r.feito_em ? " feito" : "") + (r.para===meuEmail() && !r.feito_em ? " pend" : ""));
  const topo = el("div","av-topo");
  topo.append(el("strong",null, r.de===meuEmail() ? "Você → " + (r.para_nome||r.para) : (r.de_nome||r.de)), el("span",null,quando(r.criado_em)));
  c.appendChild(topo);
  if(r.paciente_id && !naFicha){
    const meu = pacientes.find(x=>x.id===r.paciente_id);
    const pb = el("button","av-pac","👤 " + (r.paciente_nome || "Paciente") + (meu ? "" : " (não está na sua lista)"));
    if(meu) pb.addEventListener("click",()=>abrir(meu.id)); else pb.disabled = true;
    c.appendChild(pb);
  }
  if(r.responde_a){ const o = avisos.find(x=>x.id===r.responde_a); if(o) c.appendChild(el("div","av-cita","↪ "+String(o.texto).slice(0,140))); }
  c.appendChild(el("div","av-txt", r.texto));
  if(r.anexo){ const a = el("button","av-anexo","📎 Abrir " + (r.anexo_nome || "anexo")); a.addEventListener("click",()=>abrirAnexo(r)); c.appendChild(a); }
  const rod = el("div","av-rod");
  rod.appendChild(el("div","av-st", r.feito_em ? "✔ Visto e respondido " + quando(r.feito_em) : (r.de===meuEmail() ? (r.lido_em ? "Lido " + quando(r.lido_em) : "Ainda não lido") : "Aguardando seu retorno")));
  const ops = el("div","av-ops");
  if(r.para === meuEmail()){
    const rb = el("button","btn btn-sm btn-primary","Responder");
    rb.addEventListener("click",()=>{
      if(c.querySelector(".av-resp")) return;
      const f = el("div","av-resp");
      const t = el("textarea"); t.placeholder = "Seu retorno para " + (r.de_nome||"a equipe") + " (ex.: exame ok, pode marcar retorno / precisa de cirurgia / pedir outro exame)";
      const lin = el("div","av-ops");
      const cx = el("button","btn btn-sm btn-ghost","Cancelar"); cx.addEventListener("click",()=>f.remove());
      const ok = el("button","btn btn-sm btn-primary","Enviar retorno");
      ok.addEventListener("click", async ()=>{
        const texto = t.value.trim(); if(!texto){ t.focus(); return; }
        ok.disabled = true; ok.textContent = "Enviando…";
        const { error } = await sb.from("funil_recados").insert({
          de: meuEmail(), de_nome: eu.nome, para: r.de, para_nome: r.de_nome,
          paciente_id: r.paciente_id, paciente_nome: r.paciente_nome, texto, responde_a: r.id
        });
        if(error){ toast("Não consegui enviar. Tente de novo."); ok.disabled = false; ok.textContent = "Enviar retorno"; return; }
        const agora = new Date().toISOString();
        await sb.from("funil_recados").update({ feito_em: agora, lido_em: r.lido_em || agora }).eq("id", r.id);
        toast("Retorno enviado para " + (r.de_nome||"a equipe") + ".");
        carregarAvisos();
      });
      lin.append(cx, ok); f.append(t, lin); c.appendChild(f); t.focus();
    });
    ops.appendChild(rb);
    if(!r.feito_em){
      const vb = el("button","btn btn-sm","Visto ✔"); vb.title = "Marca como visto, sem escrever resposta";
      vb.addEventListener("click", async ()=>{
        const agora = new Date().toISOString();
        const { error } = await sb.from("funil_recados").update({ feito_em: agora, lido_em: r.lido_em || agora }).eq("id", r.id);
        if(error) toast("Não consegui marcar."); else carregarAvisos();
      });
      ops.appendChild(vb);
    }
  }
  rod.appendChild(ops); c.appendChild(rod);
  return c;
}
function renderAvisos(){
  const c = $("#conteudo"); c.textContent = "";
  const recebidos = avisos.filter(r=>r.para===meuEmail()).sort((a,b)=>(!!a.feito_em - !!b.feito_em) || String(b.criado_em).localeCompare(String(a.criado_em)));
  const s = el("section","grupo");
  const h = el("h2",null,"Avisos da equipe"); h.appendChild(el("span","n",String(avisosPendentes().length)));
  s.appendChild(h);
  if(!recebidos.length) s.appendChild(el("div","vazio","Nenhum aviso por enquanto. Quando a equipe mandar um exame ou pedir seu retorno sobre um paciente, aparece aqui."));
  recebidos.forEach(r=>s.appendChild(cartaoAviso(r)));
  c.appendChild(s);
  // abriu a aba: o que chegou fica como lido
  const ids = avisos.filter(r=>r.para===meuEmail() && !r.lido_em).map(r=>r.id);
  if(ids.length){ const agora = new Date().toISOString(); avisos.forEach(r=>{ if(ids.includes(r.id)) r.lido_em = agora; }); badgeAvisos(); sb.from("funil_recados").update({ lido_em: agora }).in("id", ids).then(()=>{}); }
}
function desenharAvisosFicha(sec, pid){
  sec.querySelectorAll(".av").forEach(n=>n.remove());
  const lista = avisos.filter(r=>r.paciente_id===pid).sort((a,b)=>String(a.criado_em).localeCompare(String(b.criado_em)));
  const vz = sec.querySelector(".av-vazio"); if(vz) vz.style.display = lista.length ? "none" : "";
  const compo = sec.querySelector(":scope > .av-resp");
  lista.forEach(r=>sec.insertBefore(cartaoAviso(r, true), compo || null));
}

function itemPaciente(p, mostrarData){
  const b = el("button","card item");
  const q = el("div","quando");
  if(p.dataConsulta){
    q.textContent = mostrarData ? dataBR(p.dataConsulta) : (p.horaConsulta || "—");
    q.appendChild(el("small",null, mostrarData ? diaSemana(p.dataConsulta)+(p.horaConsulta?" · "+p.horaConsulta:"") : (p.modalidade||"")));
  }else{ q.textContent = "—"; q.appendChild(el("small",null,"sem data")); }
  const m = el("div");
  m.append(el("div","nome",p.nome||"Sem nome"),
           el("div","det",[p.tratamento && p.tratamento!=="A definir" ? p.tratamento : null, p.modalidade==="Presencial" ? (p.local||"Presencial") : p.modalidade, p.convenio==="Sim" ? (p.nomeConvenio||"Convênio") : (p.convenio==="Não" ? "Particular" : null)].filter(Boolean).join(" · ")));
  const [txt,cls] = situacao(p);
  b.append(q, m, el("span","pill "+cls, txt));
  b.addEventListener("click",()=>abrir(p.id));
  return b;
}

function grupo(titulo, lista, mostrarData, vazio){
  const s = el("section","grupo");
  const h = el("h2",null,titulo); h.appendChild(el("span","n",String(lista.length)));
  s.appendChild(h);
  const l = el("div","lista");
  if(!lista.length) l.appendChild(el("div","vazio",vazio));
  lista.forEach(p => l.appendChild(itemPaciente(p, mostrarData)));
  s.appendChild(l);
  return s;
}

const porHorario = (a,b) => ((a.dataConsulta||"")+(a.horaConsulta||"")).localeCompare((b.dataConsulta||"")+(b.horaConsulta||""));

let calMes = null, calDia = null;
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function renderAgenda(){
  const c = $("#conteudo"); c.textContent = "";
  const h = hoje();
  if(!calMes) calMes = h.slice(0,7);
  if(!calDia || !calDia.startsWith(calMes)) calDia = h.startsWith(calMes) ? h : calMes + "-01";
  const ano = Number(calMes.slice(0,4)), mes = Number(calMes.slice(5,7)) - 1;
  const ativos = pacientes.filter(p => p.dataConsulta && !["perdido"].includes(p.etapa));
  const porDia = {};
  ativos.forEach(p => { (porDia[p.dataConsulta] = porDia[p.dataConsulta] || []).push(p); });
  Object.values(porDia).forEach(l => l.sort(porHorario));
  const pendentes = pacientes.filter(p => precisaRegistro(p) && p.dataConsulta < h).sort(porHorario);

  // números rápidos
  const deHoje = porDia[h] || [];
  const doMes = ativos.filter(p => p.dataConsulta.startsWith(calMes));
  const k = el("div","kpis");
  [["Hoje", deHoje.length, ""], ["Faltam registrar", pendentes.length + deHoje.filter(precisaRegistro).length, pendentes.length?"alert":""], ["Consultas no mês", doMes.length, ""]]
    .forEach(([l,v,cl]) => { const d = el("div","card kpi"+(cl?" "+cl:"")); d.append(el("span","v",String(v)), el("span","l",l)); k.appendChild(d); });
  c.appendChild(k);
  if(pendentes.length) c.appendChild(grupo("Consultas passadas sem registro", pendentes, true, ""));

  // cabeçalho do mês
  const top = el("div","cal-top");
  const ant = el("button","btn btn-sm","‹"), prox = el("button","btn btn-sm","›"), hj = el("button","btn btn-sm btn-ghost","Hoje");
  const mover = n => { const d = new Date(ano, mes + n, 1); calMes = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); calDia = null; renderAgenda(); };
  ant.addEventListener("click", ()=>mover(-1)); prox.addEventListener("click", ()=>mover(1));
  hj.addEventListener("click", ()=>{ calMes = h.slice(0,7); calDia = h; renderAgenda(); });
  const nm = MESES[mes]; top.append(ant, el("h2",null, nm.charAt(0).toUpperCase() + nm.slice(1) + " de " + ano), prox, hj);
  c.appendChild(top);

  const wrap = el("div","cal-wrap");
  const grid = el("div","cal");
  ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].forEach(d => grid.appendChild(el("div","dow",d)));
  const ini = new Date(ano, mes, 1 - new Date(ano, mes, 1).getDay());
  for(let i=0;i<42;i++){
    const d = new Date(ini); d.setDate(ini.getDate()+i);
    if(i>=35 && d.getMonth()!==mes) break;
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const doM = d.getMonth()===mes;
    const cel = el("button","dia"+(doM?"":" fora")+(iso===h?" hoje":"")+(iso===calDia?" sel":""));
    cel.appendChild(el("span","num",String(d.getDate())));
    const l = porDia[iso] || [];
    l.slice(0,3).forEach(p => {
      const [, cls] = situacao(p);
      const ev = el("div","ev "+cls);
      ev.append(el("b",null,(p.horaConsulta||"").slice(0,5)), el("span",null," "+String(p.nome||"").split(" ")[0]));
      cel.appendChild(ev);
    });
    if(l.length > 3) cel.appendChild(el("div","mais","+" + (l.length-3)));
    if(l.length) cel.appendChild(el("div","pontos", "●".repeat(Math.min(l.length,5))));
    cel.addEventListener("click", ()=>{ if(!doM) calMes = iso.slice(0,7); calDia = iso; renderAgenda(); });
    grid.appendChild(cel);
  }
  wrap.appendChild(grid);

  // consultas do dia escolhido
  const det = el("section","grupo cal-det");
  const dd = new Date(calDia+"T12:00:00");
  const tit = dd.toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
  const lista = porDia[calDia] || [];
  const hh = el("h2",null, tit.charAt(0).toUpperCase()+tit.slice(1)); hh.appendChild(el("span","n",String(lista.length)));
  det.appendChild(hh);
  const ld = el("div","lista");
  if(!lista.length) ld.appendChild(el("div","vazio","Nenhuma consulta neste dia."));
  lista.forEach(p => ld.appendChild(itemPaciente(p, false)));
  det.appendChild(ld);
  wrap.appendChild(det);
  c.appendChild(wrap);
}

function renderPacientes(){
  const c = $("#conteudo"); c.textContent = "";
  const i = el("input"); i.type = "text"; i.className = "busca"; i.placeholder = "Buscar por nome"; i.value = busca;
  i.addEventListener("input", e => { busca = e.target.value; desenhar(); });
  c.appendChild(i);
  const box = el("div"); c.appendChild(box);
  function desenhar(){
    box.textContent = "";
    const q = busca.trim().toLowerCase();
    const lista = pacientes.filter(p => !q || (p.nome||"").toLowerCase().includes(q))
      .sort((a,b) => String(b.dataConsulta||"").localeCompare(String(a.dataConsulta||"")));
    box.appendChild(grupo("Todos os meus pacientes", lista, true, q ? "Ninguém com esse nome." : "Ainda não há pacientes encaminhados para você."));
  }
  desenhar();
  i.focus();
}

function fechar(){ document.querySelectorAll(".scrim,.drawer").forEach(x=>x.remove()); }

function abrir(id){
  const p = pacientes.find(x => x.id === id); if(!p) return;
  fechar();
  const scrim = el("div","scrim"); scrim.addEventListener("click", fechar);
  const d = el("aside","drawer"); d.setAttribute("role","dialog"); d.setAttribute("aria-label","Ficha do paciente");
  const h = el("header"); h.appendChild(el("h2",null,p.nome||"Paciente"));
  const bx = el("button","btn btn-ghost btn-sm","Fechar"); bx.addEventListener("click", fechar); h.appendChild(bx);
  d.appendChild(h);

  const b = el("div","body");
  const f = el("div","ficha");
  const campo = (rot, val, full) => { if(!val) return; const x = el("div", full?"full":null); x.appendChild(el("span",null,rot)); x.appendChild(document.createTextNode(val)); f.appendChild(x); };
  campo("Consulta", p.dataConsulta ? dataBR(p.dataConsulta)+" ("+diaSemana(p.dataConsulta)+")"+(p.horaConsulta?" às "+p.horaConsulta:"") : "Sem data marcada");
  campo("Modalidade", p.modalidade==="Presencial" ? (p.local||"Presencial") : (p.modalidade||""));
  campo("Tratamento", p.tratamento);
  campo("Convênio", p.convenio==="Sim" ? (p.nomeConvenio||"Sim") : (p.convenio==="Não" ? "Não · particular" : p.convenio));
  campo("Cidade", p.cidade);
  campo("WhatsApp", p.telefone);
  campo("Etapa", ETAPAS[p.etapa]);
  campo("Observações da equipe", p.observacoes, true);
  const avs = el("div","bloco"); avs.id = "avFicha"; avs.dataset.pid = p.id;
  avs.appendChild(el("h3",null,"Recados com a equipe sobre este paciente"));
  avs.appendChild(el("div","vazio av-vazio","Nenhum recado ainda."));
  // o cirurgião manda um recado para a equipe (Claudemir e Ana Clara)
  const comp = el("div","av-resp");
  const tq = el("textarea"); tq.placeholder = "Recado para a equipe sobre " + (p.nome||"este paciente") + " (ex.: ela vai mandar a carteirinha; marcar retorno em 15 dias)";
  const be = el("button","btn btn-sm btn-primary","Mandar recado para a equipe");
  be.addEventListener("click", async ()=>{
    const texto = tq.value.trim(); if(!texto){ tq.focus(); return; }
    be.disabled = true; be.textContent = "Enviando…";
    const { error } = await sb.rpc("recado_para_equipe", { p_paciente_id: p.id, p_texto: texto });
    be.disabled = false; be.textContent = "Mandar recado para a equipe";
    if(error){ toast("Não consegui enviar. Tente de novo."); return; }
    tq.value = ""; toast("Recado enviado para a equipe."); carregarAvisos();
  });
  comp.append(tq, be);
  b.appendChild(avs);
  desenharAvisosFicha(avs, p.id);
  avs.appendChild(comp);
  b.appendChild(f);

  const tb = el("div","bloco");
  const bt = el("button","btn btn-primary","🎥 Iniciar teleconsulta");
  bt.addEventListener("click", async ()=>{
    const w = window.open("about:blank","_blank");
    try{ const id = await teleSala(p, meuEmail()); if(w) w.location = teleLinkMedico(id); else location.href = teleLinkMedico(id); }
    catch(e){ if(w) w.close(); toast("Não consegui abrir a sala. Tente de novo."); }
  });
  tb.append(el("h3",null,"Consulta online"), bt,
    el("div","vazio","Abre a sala de vídeo. Lá aparece o link para mandar ao paciente, se a equipe ainda não mandou."));
  b.appendChild(tb);

  const bloco = el("div","bloco");
  if(p.consultaRegistradaEm){
    bloco.appendChild(el("h3",null,"Seu registro da consulta"));
    const r = el("div","registrado");
    r.textContent = (p.consultaCompareceu===false ? "Não compareceu." : "Compareceu."+(p.consultaPediuExames ? " Pediu exames: "+[...(p.examesTipos||[]), p.examesPedidos].filter(Boolean).join(" · ")+"." : " Sem pedido de exames."))
      + (p.voucherAuto && p.voucherEmitido ? "\nVoucher de ressonância Blume emitido em "+dataBR(p.voucherEmitido)+"." : "")
      + (p.resumoConsulta ? "\n\n"+p.resumoConsulta : "")
      + "\n\nRegistrado em "+dataBR(String(p.consultaRegistradaEm).slice(0,10))+".";
    bloco.appendChild(r);
    const ed = el("button","btn btn-sm","Corrigir registro"); ed.style.marginTop = "10px";
    ed.addEventListener("click", ()=>{ bloco.textContent = ""; bloco.appendChild(formRegistro(p)); });
    bloco.appendChild(ed);
  }else{
    bloco.appendChild(formRegistro(p));
  }
  b.appendChild(bloco);

  const hist = (p.historico||[]).slice(-8).reverse();
  if(hist.length){
    const hb = el("div","bloco"); hb.appendChild(el("h3",null,"Últimos registros"));
    const ul = el("div","hist");
    hist.forEach(x => { const li = el("div"); li.append(el("span","d",dataBR(x.data)), el("span",null,x.texto)); ul.appendChild(li); });
    hb.appendChild(ul); b.appendChild(hb);
  }
  d.appendChild(b);
  document.body.append(scrim, d);
}

function radios(nome, opcoes, atual){
  const w = el("div","opcoes");
  opcoes.forEach(([v,l]) => {
    const lab = el("label"); const i = el("input"); i.type = "radio"; i.name = nome; i.value = v;
    if(atual === v) i.checked = true;
    lab.append(i, document.createTextNode(l)); w.appendChild(lab);
  });
  return w;
}

function formRegistro(p){
  const f = el("form");
  f.appendChild(el("h3",null,"Registrar a consulta"));
  const atualC = p.consultaRegistradaEm ? (p.consultaCompareceu===false?"nao":"sim") : null;
  const atualE = p.consultaRegistradaEm ? (p.consultaPediuExames?"sim":"nao") : null;

  const q1 = el("div","perg"); q1.append(el("span",null,"O paciente compareceu?"), radios("comp",[["sim","Sim, atendi"],["nao","Não compareceu"]], atualC));
  const q2 = el("div","perg"); q2.append(el("span",null,"Pediu exames?"), radios("exam",[["sim","Sim"],["nao","Não"]], atualE));
  const qx = el("div","perg"); qx.appendChild(el("span",null,"Quais exames"));
  const tiposAtuais = p.examesTipos || [];
  const cks = el("div","opcoes");
  TIPOS_EXAME.forEach(t => {
    const lab = el("label"); const i = el("input"); i.type = "checkbox"; i.name = "tipo"; i.value = t;
    if(tiposAtuais.includes(t)) i.checked = true;
    lab.append(i, document.createTextNode(t)); cks.appendChild(lab);
  });
  const ix = el("input"); ix.type = "text"; ix.placeholder = "Detalhes ou outro exame (opcional). Ex.: ressonância de ATM bilateral"; ix.value = p.examesPedidos||"";
  ix.style.marginTop = "8px";
  qx.append(cks, ix);
  const qr = el("label","f perg"); qr.append(document.createTextNode("Resumo da consulta"));
  const tr = el("textarea"); tr.placeholder = "Queixa, achados, conduta e próximo passo. Ao salvar, a equipe (Claudemir e Ana Clara) recebe este resumo como recado."; tr.value = p.resumoConsulta||""; qr.appendChild(tr);
  f.append(q1, q2, qx, qr);

  function ajustar(){
    const comp = f.querySelector("input[name=comp]:checked")?.value;
    q2.hidden = comp === "nao";
    const ex = f.querySelector("input[name=exam]:checked")?.value;
    qx.hidden = comp === "nao" || ex !== "sim";
  }
  f.addEventListener("change", ajustar); ajustar();

  const salvar = el("button","btn btn-primary","Salvar registro"); salvar.type = "submit";
  f.appendChild(salvar);
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const comp = f.querySelector("input[name=comp]:checked")?.value;
    if(!comp){ toast("Marque se o paciente compareceu."); return; }
    const exam = comp === "sim" ? f.querySelector("input[name=exam]:checked")?.value : "nao";
    if(comp === "sim" && !exam){ toast("Marque se pediu exames."); return; }
    const tipos = [...f.querySelectorAll("input[name=tipo]:checked")].map(i=>i.value);
    if(exam === "sim" && !tipos.length && !ix.value.trim()){ toast("Marque quais exames pediu."); return; }
    salvar.disabled = true; salvar.textContent = "Salvando…";
    const { data: res, error } = await sb.rpc("registrar_consulta", {
      p_id: p.id, p_compareceu: comp === "sim", p_pediu_exames: exam === "sim",
      p_resumo: tr.value.trim(), p_exames: exam === "sim" ? ix.value.trim() : "",
      p_exames_tipos: exam === "sim" ? tipos : []
    });
    salvar.disabled = false; salvar.textContent = "Salvar registro";
    if(error){ toast("Não consegui salvar. Tente de novo."); return; }
    toast(res && res.voucherEmitido ? "Registro salvo. O voucher de ressonância da Blume já foi emitido para o paciente." : "Registro salvo. A equipe já está vendo.");
    await carregar(); abrir(p.id);
  });
  return f;
}

$("#tAgenda").addEventListener("click", ()=>{ aba = "agenda"; render(); });
$("#tPac").addEventListener("click", ()=>{ aba = "pac"; render(); });
$("#tAvisos").addEventListener("click", ()=>{ aba = "avisos"; render(); });

$("#bSair").addEventListener("click", FUNIL.sair);
$("#bSenha").addEventListener("click", FUNIL.trocarSenha);
document.addEventListener("keydown", e => { if(e.key === "Escape") fechar(); });

(async ()=>{
  eu = await FUNIL.exigir(["cirurgiao"]);
  $("#ola").textContent = "Olá, " + eu.nome;
  await carregar();
  await carregarAvisos();
  if(avisosPendentes().length && !pacientes.some(p=>p.dataConsulta===hoje())){ aba = "avisos"; render(); }
  sb.channel("avisos")
    .on("postgres_changes", { event: "*", schema: "public", table: "funil_recados" }, ev => {
      if(ev.eventType === "INSERT" && ev.new && ev.new.para === meuEmail()) toast("📩 Novo aviso de " + (ev.new.de_nome||"equipe") + (ev.new.paciente_nome ? " sobre " + ev.new.paciente_nome : ""));
      carregarAvisos();
    }).subscribe();
  setInterval(carregarAvisos, 2*60*1000);
  sb.channel("meus-pacientes")
    .on("postgres_changes", { event: "*", schema: "public", table: "funil_pacientes" }, () => carregar())
    .subscribe();
  setInterval(carregar, 5*60*1000);
})();
</script>
