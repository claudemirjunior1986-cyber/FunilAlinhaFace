<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1424">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<title>Consulta online · Alinha Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0B1424; --surface:#121E33; --surface-2:#182742; --line:#26385A;
    --ink:#E8EEF7; --ink-2:#AAB9CF; --ink-3:#7387A2;
    --accent:#8FBEDC; --gold:#D7A94A; --ok:#5EC098; --crit:#EC8078;
    --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px}
  button{font:inherit;cursor:pointer}
  .tela{min-height:100dvh;display:flex;flex-direction:column}
  [hidden]{display:none!important}

  /* entrada */
  .entrada{flex:1;display:grid;place-items:center;padding:20px 16px}
  .caixa{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .marca{display:flex;align-items:center;gap:10px}
  .marca b{font-family:var(--font-display);font-size:19px}
  .marca span{color:var(--ink-3);font-size:12.5px;display:block}
  h1{font-family:var(--font-display);font-size:22px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--ink-2);margin:0;line-height:1.45}
  .previa{position:relative;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden}
  .previa video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .previa .semcam{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);text-align:center;padding:16px}
  label.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
  input[type=text]{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:11px 12px;font:inherit}
  .aceite{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .aceite input{margin-top:3px;width:18px;height:18px;flex-shrink:0}
  .btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:12px 16px;font-weight:600}
  .btn-primary{background:var(--accent);color:#0B1424;border-color:var(--accent)}
  .btn[disabled]{opacity:.5}
  .msg{border-radius:10px;padding:10px 12px;font-size:14px;background:#3A1E1B;color:var(--crit)}
  .msg.info{background:var(--surface-2);color:var(--ink-2)}
  .link{display:flex;gap:6px}
  .link input{flex:1;font-size:12.5px}

  /* chamada */
  .chamada{position:fixed;inset:0;background:#000}
  #remoto{width:100%;height:100%;object-fit:contain;background:#000}
  #local{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:min(28vw,180px);aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.25);transform:scaleX(-1);background:#111}
  .topo{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .estado{align-self:flex-start;background:rgba(11,20,36,.75);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:13px;pointer-events:auto;max-width:calc(100% - min(28vw,180px) - 30px)}
  .estado .p{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}
  .estado.ok .p{background:var(--ok)} .estado.erro .p{background:var(--crit)}
  .selo{align-self:flex-start;background:rgba(11,20,36,.75);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--ink-2);pointer-events:auto}
  .espera{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-2);pointer-events:none}
  .espera b{display:block;font-family:var(--font-display);font-size:20px;color:var(--ink);margin-bottom:6px}
  .barra{position:absolute;left:0;right:0;bottom:0;padding:14px 12px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .rb{width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;display:grid;place-items:center}
  .rb.off{background:#fff;color:#0B1424}
  .rb.sair{background:#D9443A}
  .plano-b{position:absolute;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .plano-b a,.plano-b button{background:rgba(11,20,36,.85);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:9px 14px;text-decoration:none;font-size:13.5px}
  .fim{flex:1;display:grid;place-items:center;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="tela">

  <!-- antes de entrar -->
  <div class="entrada" id="vEntrada">
    <div class="caixa">
      <div class="marca">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1B2E4D"></circle><path d="M17 1a16 16 0 0 0 0 32Z" fill="#8FBEDC"></path><path d="M5 26 L27 7" stroke="#D7A94A" stroke-width="1.6" fill="none"></path></svg>
        <div><b>Alinha Face</b><span>Cirurgia ortognática &amp; ATM</span></div>
      </div>
      <h1 id="titulo">Consulta online</h1>
      <p class="sub" id="subtitulo">Carregando…</p>
      <div class="previa"><video id="previa" autoplay playsinline muted></video><div class="semcam" id="semCam" hidden></div></div>

      <label class="campo" id="campoNome" hidden>Seu nome
        <input type="text" id="nome" autocomplete="name" placeholder="Nome e sobrenome">
      </label>
      <label class="aceite" id="campoAceite" hidden>
        <input type="checkbox" id="aceite">
        <span>Autorizo a gravação do <b>áudio</b> desta consulta, usada só para o médico gerar o resumo no meu prontuário. O áudio é apagado depois. (Opcional: a consulta acontece do mesmo jeito sem marcar.)</span>
      </label>

      <div id="blocoLink" hidden>
        <label class="campo">Link para o paciente
          <span class="link"><input type="text" id="linkPac" readonly><button class="btn" id="bCopiar" type="button">Copiar</button></span>
        </label>
      </div>

      <div class="msg" id="erro" hidden></div>
      <button class="btn btn-primary" id="bEntrar" disabled>Entrar na consulta</button>
      <p class="sub" style="font-size:12.5px;color:var(--ink-3)">Use fone de ouvido se puder. A conexão é direta entre os aparelhos e não fica gravada no site.</p>
    </div>
  </div>

  <!-- durante a chamada -->
  <div class="chamada" id="vChamada" hidden>
    <video id="remoto" autoplay playsinline></video>
    <div class="espera" id="espera"><div><b id="esperaT">Aguardando…</b><span id="esperaS"></span></div></div>
    <video id="local" autoplay playsinline muted></video>
    <div class="topo">
      <div class="estado" id="estado"><span class="p"></span><span id="estadoT">Conectando…</span></div>
      <div class="selo" id="seloAceite" hidden></div>
    </div>
    <div class="plano-b" id="planoB" hidden></div>
    <div class="barra">
      <button class="rb" id="bMic" title="Microfone">🎤</button>
      <button class="rb" id="bCam" title="Câmera">📷</button>
      <button class="rb" id="bVirar" title="Trocar câmera" hidden>🔄</button>
      <button class="rb sair" id="bSair" title="Sair">✕</button>
    </div>
  </div>

  <!-- depois -->
  <div class="fim" id="vFim" hidden>
    <div class="caixa">
      <h1>Consulta encerrada</h1>
      <p class="sub" id="fimTexto">Obrigado! Qualquer dúvida, fale com a gente pelo WhatsApp.</p>
      <button class="btn" id="bVoltar" hidden>Entrar de novo</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const SALA = qs.get("c") || "";
const EH_PACIENTE = qs.has("p");
const sb = FUNIL.sb;
const ICE = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }];
const MEU_ID = Math.random().toString(36).slice(2,10);

let local = null, pc = null, canal = null, linha = null;
let conectadoUmaVez = false, n = 0, filaCand = [], ultimaOferta = 0, timerHello = null, timerFalha = null;
let usandoTraseira = false, aceitePaciente = null, nomePaciente = "";

function erro(t){ const e = $("#erro"); e.hidden = !t; e.textContent = t || ""; }
function estado(t, cls){ $("#estadoT").textContent = t; $("#estado").className = "estado" + (cls ? " " + cls : ""); }
function espera(t, s){ $("#espera").hidden = !t; $("#esperaT").textContent = t || ""; $("#esperaS").textContent = s || ""; }
const uuidOk = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(SALA);

/* ---------- câmera e microfone ---------- */
async function abrirCamera(){
  try{
    local = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
    });
  }catch(e){
    try{ local = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
    catch(e2){ local = null; }
  }
  if(!local){
    $("#semCam").hidden = false;
    $("#semCam").textContent = "Não consegui acessar a câmera e o microfone. Toque no cadeado/ícone ao lado do endereço e permita câmera e microfone, depois recarregue a página.";
    return false;
  }
  $("#previa").srcObject = local;
  if(!local.getVideoTracks().length){ $("#semCam").hidden = false; $("#semCam").textContent = "Sem câmera — entra só com áudio."; }
  try{ const ds = await navigator.mediaDevices.enumerateDevices(); $("#bVirar").hidden = ds.filter(d=>d.kind==="videoinput").length < 2; }catch(e){}
  return true;
}

/* ---------- conversa entre os aparelhos (sinalização) ---------- */
function enviar(msg){ if(canal) canal.send({ type:"broadcast", event:"sig", payload: Object.assign({ de: MEU_ID, papel: EH_PACIENTE ? "paciente" : "medico" }, msg) }); }

function novaConexao(){
  if(pc){ try{ pc.close(); }catch(e){} }
  filaCand = [];
  pc = new RTCPeerConnection({ iceServers: ICE });
  if(local) local.getTracks().forEach(t => pc.addTrack(t, local));
  else { pc.addTransceiver("audio",{direction:"recvonly"}); pc.addTransceiver("video",{direction:"recvonly"}); }
  pc.onicecandidate = e => { if(e.candidate) enviar({ t:"cand", c: e.candidate, n }); };
  pc.ontrack = e => { const r = $("#remoto"); if(r.srcObject !== e.streams[0]) r.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if(s === "connected"){
      clearTimeout(timerFalha); $("#planoB").hidden = true;
      estado(EH_PACIENTE ? "Conectado com o médico" : "Conectado com " + (nomePaciente || "o paciente"), "ok");
      espera("");
      if(!conectadoUmaVez){ conectadoUmaVez = true; if(!EH_PACIENTE) registrar({ inicio: new Date().toISOString() }, true); }
    }else if(s === "connecting"){
      estado("Conectando…");
      clearTimeout(timerFalha); timerFalha = setTimeout(()=>{ if(pc && pc.connectionState !== "connected") mostrarPlanoB(); }, 25000);
    }else if(s === "disconnected"){
      estado("Conexão instável… tentando de novo", "erro");
    }else if(s === "failed"){
      estado("A conexão caiu. Tentando de novo…", "erro");
      mostrarPlanoB();
    }
  };
  return pc;
}
async function aplicarFila(){ for(const c of filaCand.splice(0)){ try{ await pc.addIceCandidate(c); }catch(e){} } }

async function aoReceber({ payload: m }){
  if(!m || m.de === MEU_ID) return;
  if(m.t === "bye"){
    estado(EH_PACIENTE ? "O médico saiu da sala" : "O paciente saiu da sala", "erro");
    espera(EH_PACIENTE ? "O médico saiu" : "O paciente saiu", "Se foi sem querer, ele pode entrar de novo pelo mesmo link.");
    return;
  }
  if(EH_PACIENTE){
    if(m.t === "offer"){
      n = m.n; novaConexao();
      await pc.setRemoteDescription(m.sdp); await aplicarFila();
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      enviar({ t:"answer", sdp: pc.localDescription, n });
    }else if(m.t === "cand" && m.n === n){
      if(pc && pc.remoteDescription) { try{ await pc.addIceCandidate(m.c); }catch(e){} } else filaCand.push(m.c);
    }else if(m.t === "medico"){
      espera("O médico está entrando…", "Conectando a chamada.");
    }
  }else{
    if(m.t === "hello"){
      if(m.nome) nomePaciente = m.nome;
      if(typeof m.aceite === "boolean" && m.aceite !== aceitePaciente){ aceitePaciente = m.aceite; mostrarAceite(); registrar({ consentimento: m.aceite, consentimento_em: new Date().toISOString() }); }
      const st = pc ? pc.connectionState : "new";
      const recente = Date.now() - ultimaOferta < 12000;
      if(st === "connected" || ((st === "connecting" || st === "new") && pc && recente)) return;
      n++; ultimaOferta = Date.now();
      espera(nomePaciente ? nomePaciente + " está na sala" : "Paciente na sala", "Conectando…");
      novaConexao();
      const of = await pc.createOffer(); await pc.setLocalDescription(of);
      enviar({ t:"offer", sdp: pc.localDescription, n });
    }else if(m.t === "answer" && m.n === n && pc && pc.signalingState === "have-local-offer"){
      await pc.setRemoteDescription(m.sdp); await aplicarFila();
    }else if(m.t === "cand" && m.n === n){
      if(pc && pc.remoteDescription) { try{ await pc.addIceCandidate(m.c); }catch(e){} } else filaCand.push(m.c);
    }
  }
}

function mostrarAceite(){
  const s = $("#seloAceite"); s.hidden = aceitePaciente === null;
  s.textContent = aceitePaciente ? "✔ Paciente autorizou gravar o áudio para o resumo" : "Paciente não autorizou gravação — faça o resumo à mão";
}
function mostrarPlanoB(){
  const b = $("#planoB"); if(!b.hidden) return;
  b.hidden = false; b.textContent = "";
  if(EH_PACIENTE){
    const s = document.createElement("button"); s.textContent = "Não conectou? Avise a equipe pelo WhatsApp";
    s.addEventListener("click", ()=>alert("Volte ao WhatsApp da Alinha Face e avise que a chamada não conectou. A equipe manda outro link (Google Meet)."));
    b.appendChild(s);
  }else{
    const a = document.createElement("a"); a.href = "https://meet.google.com/new"; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Não conectou? Abrir um Google Meet (plano B)";
    b.appendChild(a);
  }
}

/* ---------- registro no banco (só o lado do médico, logado) ---------- */
async function registrar(campos, soSeVazio){
  if(EH_PACIENTE || !linha) return;
  if(soSeVazio && linha.inicio) return;
  Object.assign(linha, campos);
  await sb.from("funil_teleconsultas").update(campos).eq("id", SALA);
}

/* ---------- entrar e sair ---------- */
async function entrar(){
  if(EH_PACIENTE){
    nomePaciente = $("#nome").value.trim();
    try{ localStorage.setItem("tele_nome", nomePaciente); }catch(e){}
  }
  $("#vEntrada").hidden = true; $("#vChamada").hidden = false;
  $("#local").srcObject = local;
  estado("Entrando na sala…");
  espera(EH_PACIENTE ? "Aguardando o médico" : "Aguardando o paciente", EH_PACIENTE ? "Você já está na sala. Assim que o médico entrar, a chamada começa." : "Mande o link para o paciente, se ainda não mandou. A chamada começa quando ele entrar.");
  canal = sb.channel("tele-" + SALA, { config: { broadcast: { self: false } } });
  canal.on("broadcast", { event: "sig" }, aoReceber);
  canal.subscribe(st => {
    if(st === "SUBSCRIBED"){
      estado(EH_PACIENTE ? "Na sala — aguardando o médico" : "Na sala — aguardando o paciente");
      if(EH_PACIENTE){
        const ola = () => { if(!pc || pc.connectionState !== "connected") enviar({ t:"hello", nome: nomePaciente, aceite: $("#aceite").checked }); };
        ola(); timerHello = setInterval(ola, 2500);
      }else{
        enviar({ t:"medico" });
      }
    }else if(st === "CHANNEL_ERROR" || st === "TIMED_OUT"){
      estado("Sem conexão com a sala. Verifique a internet.", "erro");
    }
  });
}
function sair(){
  enviar({ t:"bye" });
  clearInterval(timerHello);
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(local) local.getTracks().forEach(t=>t.stop());
  if(canal){ try{ sb.removeChannel(canal); }catch(e){} }
  if(!EH_PACIENTE) registrar({ fim: new Date().toISOString() });
  $("#vChamada").hidden = true; $("#vFim").hidden = false;
  if(!EH_PACIENTE){ $("#fimTexto").textContent = "Consulta encerrada. Registre a consulta na ficha do paciente (compareceu, exames e resumo)."; }
  $("#bVoltar").hidden = false;
}
addEventListener("pagehide", ()=>{ try{ enviar({ t:"bye" }); }catch(e){} });

$("#bMic").addEventListener("click", ()=>{
  if(!local) return; const a = local.getAudioTracks()[0]; if(!a) return;
  a.enabled = !a.enabled; $("#bMic").classList.toggle("off", !a.enabled); $("#bMic").textContent = a.enabled ? "🎤" : "🔇";
});
$("#bCam").addEventListener("click", ()=>{
  if(!local) return; const v = local.getVideoTracks()[0]; if(!v) return;
  v.enabled = !v.enabled; $("#bCam").classList.toggle("off", !v.enabled);
});
$("#bVirar").addEventListener("click", async ()=>{
  try{
    usandoTraseira = !usandoTraseira;
    const novo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: usandoTraseira ? "environment" : "user" } });
    const nv = novo.getVideoTracks()[0];
    const velho = local.getVideoTracks()[0];
    if(pc){ const s = pc.getSenders().find(x=>x.track && x.track.kind==="video"); if(s) await s.replaceTrack(nv); }
    if(velho){ local.removeTrack(velho); velho.stop(); }
    local.addTrack(nv);
    $("#local").style.transform = usandoTraseira ? "none" : "scaleX(-1)";
  }catch(e){ usandoTraseira = !usandoTraseira; }
});
$("#bSair").addEventListener("click", ()=>{ if(confirm("Sair da consulta?")) sair(); });
$("#bVoltar").addEventListener("click", ()=>location.reload());
$("#bEntrar").addEventListener("click", ()=>{
  if(EH_PACIENTE && !$("#nome").value.trim()){ erro("Digite seu nome para o médico saber quem está entrando."); $("#nome").focus(); return; }
  erro(""); entrar();
});
$("#bCopiar").addEventListener("click", ()=>{
  const i = $("#linkPac"); i.select();
  navigator.clipboard?.writeText(i.value).then(()=>{ $("#bCopiar").textContent = "Copiado ✔"; setTimeout(()=>$("#bCopiar").textContent = "Copiar", 2000); });
});

/* ---------- início ---------- */
(async ()=>{
  if(!uuidOk){ $("#subtitulo").textContent = ""; erro("Link de consulta inválido. Peça um novo link para a equipe da Alinha Face."); return; }
  if(EH_PACIENTE){
    $("#titulo").textContent = "Sua consulta online";
    $("#subtitulo").textContent = "Confira se a câmera e o microfone estão funcionando, escreva seu nome e toque em Entrar.";
    $("#campoNome").hidden = false; $("#campoAceite").hidden = false;
    try{ $("#nome").value = localStorage.getItem("tele_nome") || ""; }catch(e){}
  }else{
    const eu = await FUNIL.exigir(["cirurgiao","admin"]);
    const { data, error } = await sb.from("funil_teleconsultas").select("*").eq("id", SALA).maybeSingle();
    if(error || !data){ $("#subtitulo").textContent = ""; erro("Sala não encontrada para o seu login."); return; }
    linha = data; nomePaciente = data.paciente_nome || "";
    $("#titulo").textContent = "Consulta com " + (data.paciente_nome || "paciente");
    $("#subtitulo").textContent = "Olá, " + eu.nome + ". Confira câmera e microfone e entre. O paciente entra pelo link abaixo.";
    $("#blocoLink").hidden = false;
    $("#linkPac").value = location.origin + "/sala.html?c=" + SALA + "&p=1";
    if(typeof data.consentimento === "boolean"){ aceitePaciente = data.consentimento; mostrarAceite(); }
  }
  await abrirCamera();
  $("#bEntrar").disabled = false;
})();
</script>
</body>
</html>
